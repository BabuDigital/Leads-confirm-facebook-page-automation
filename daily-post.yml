name: Daily Facebook + Instagram post

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC = 10:00 AM IST
  workflow_dispatch:
    inputs:
      post_date:
        description: "Optional: post a specific date (YYYY-MM-DD)"
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send today's post to Zapier
        env:
          ZAPIER_WEBHOOK_URL: ${{ secrets.ZAPIER_WEBHOOK_URL }}
          POST_DATE: ${{ github.event.inputs.post_date }}
        run: python post.py
