name: Daily Facebook + Instagram post

on:
  workflow_dispatch:
    inputs:
      post_date:
        description: "Optional: post a specific date (YYYY-MM-DD)"
        required: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post today's content
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          ZAPIER_WEBHOOK_URL: ${{ secrets.ZAPIER_WEBHOOK_URL }}
          FB_PAGE_ID: "321685697686709"
          IG_USER_ID: "17841465944317810"
          POST_DATE: ${{ github.event.inputs.post_date }}
        run: python post.py
